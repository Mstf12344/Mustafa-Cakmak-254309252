name: Wikimedia fotoğrafları (3. tur)

# Kalan fotoğrafsız tarifler için elle hazırlanmış eşlemeyle Wikipedia/Commons'tan özgür lisanslı fotoğraf arar.
on:
  push:
    branches: [foto3]
    paths: ["tools/wikibooks/foto3.js", ".github/workflows/foto3.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fotoğrafları ara
        run: node tools/wikibooks/foto3.js | tee tools/wikibooks/foto3_log.txt
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wikibooks/fotolar.json tools/wikibooks/foto3_log.txt
          git diff --cached --quiet && exit 0
          git commit -m "Wikimedia fotoğrafları (3. tur) bulundu"
          git push
